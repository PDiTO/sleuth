[project]
name = "sleuth"
version = "0.1.0"
description = "A benchmark for whether LLMs can do science on a black box: choose informative experiments, find the hidden rule, and predict cases they haven't seen."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Paul Davis" }]
requires-python = ">=3.11"
keywords = ["llm", "benchmark", "evals", "active-learning", "program-synthesis", "scientific-reasoning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
]

[project.scripts]
sleuth = "sleuth.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sleuth"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PT", "RET", "TID", "PL",
]
ignore = [
    "PLR0911", # too many return statements: action validation reads better flat
    "PLR0912", # too many branches: same
    "PLR0913", # too many arguments: constructors take keyword config
    "PLR2004", # magic values in comparisons are fine in tests and domain bounds
    "PLR0915", # too many statements: the episode loop is one flat function
    "PLR0917", # too many positional arguments: prompt builders take the notebook pieces
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLC0415"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["matplotlib", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=sleuth --cov-report=term-missing"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["sleuth"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.uv]
# Keep dependency resolution within the original development period.
exclude-newer = "2026-10-20T00:00:00Z"
